<script>
// ───────── VAJONT — "The Dam Didn't Fail. The Mountain Did." · Visual Investigation ─────────
// One Canvas-2D page drawn deterministically by window.render(t). Timings: film.json (sections, subtitles).

const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('c'), x = cv.getContext('2d');

const F = { sans:'PlexSans', mono:'PlexMono' };
let FILM = null, SECS = [], FR = 0, REC = null, CUES = null;

// ── utilities ──
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3), eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

function rnd(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// sound cue registry: filled during the events pass (window.EV getter); every cue sits on the time that also drives the picture

function fl(t, at, type = 'shutter', o) { if (t >= at) cue(type, at, o); return t >= at ? 1 - seg(t, at, at + .1) : 0; } // 3-frame white flash
function dk(t, a, b, type = 'pencil', o) { if (t >= a) cue(type, a, Object.assign({ d: b - a }, o)); return eo(seg(t, a, b)); } // drawn stroke progress

// ── assets ──
const IM = {}; let GRAIN = [], COAST = [];
const KEYS = ['gorge55','village','edo','ai01','blondin57','dam60v','pano60','carlo','cabin','crack60','toc','map','ai02','lake60a','lake60b','slide63','ai03','dam63','ai04','longB','longA','pirago','dis1','v1963_3','cartolina','damModern','damAfter','aerial63'];
function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.warn('missing', src); r(null); }; i.src = src; }); }
async function boot() {
  FILM = await (await fetch('film.json')).json(); SECS = FILM.sections; window.DUR = FILM.frames / FILM.fps;
  COAST = await (await fetch('assets/coast.json')).json();
  const L = KEYS.map(k => load(`assets/${k}.jpg`).then(i => IM[k] = i));
  for (const f of ['700 40px PlexSans', '500 20px PlexSans', '400 20px PlexMono', '600 20px PlexMono', '700 20px PlexMono']) L.push(document.fonts.load(f));
  await Promise.all(L);
  for (const k of KEYS) if (!IM[k]) throw new Error('missing image ' + k);
  GRAIN = []; for (let g = 0; g < 6; g++) { const c = document.createElement('canvas'); c.width = c.height = 256; const gx = c.getContext('2d'); const d = gx.createImageData(256, 256); const r = rnd(g * 99 + 7);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } gx.putImageData(d, 0, 0); GRAIN.push(c); }
  window.READY = true;
}

// ── drawing primitives ──
function txt(s, X, Y, o = {}) {
  x.save(); x.font = `${o.w || 400} ${o.s || 24}px ${o.f || F.sans}`; x.fillStyle = o.c || C.text; x.globalAlpha *= (o.a ?? 1);
  x.textAlign = o.al || 'left'; x.textBaseline = 'alphabetic'; x.letterSpacing = (o.ls || 0) + 'px';
  const ga = x.globalAlpha; if (ga > 0.001) x.fillText(s, X, Y);
  const w = x.measureText(s).width; x.restore();
  if (REC && o.id && ga > 0.5) { const sz = o.s || 24, x0 = o.al === 'right' ? X - w : o.al === 'center' ? X - w / 2 : X;
    REC.push({ id: o.id, text: s, x0, y0: Y - sz * .8, x1: x0 + w, y1: Y + sz * .22 }); }
  return w;
}
function tw(s, o = {}) { x.save(); x.font = `${o.w || 400} ${o.s || 24}px ${o.f || F.sans}`; x.letterSpacing = (o.ls || 0) + 'px'; const w = x.measureText(s).width; x.restore(); return w; }
function hair(x0, y0, x1, y1, c = C.line, w = 1, dash) { x.save(); x.strokeStyle = c; x.lineWidth = w; if (dash) x.setLineDash(dash); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function rect(X, Y, w, h, c = C.line, lw = 1, dash) { x.save(); x.strokeStyle = c; x.lineWidth = lw; if (dash) x.setLineDash(dash); x.strokeRect(X + .5, Y + .5, w - 1, h - 1); x.restore(); }
function fill(X, Y, w, h, c) { x.fillStyle = c; x.fillRect(X, Y, w, h); }
function clipR(P) { x.beginPath(); x.rect(P.X, P.Y, P.w, P.h); x.clip(); }
// one grade for every source: photos greyscale/contrast; AI stills a touch softer; maps and the geology concept inverted into dark line drawings
function plate(img, sx, sy, sw, sh, X, Y, w, h, o = {}) {
  x.save(); x.globalAlpha *= (o.a ?? 1); fill(X, Y, w, h, '#000');
  x.filter = o.inv ? 'grayscale(1) invert(1) brightness(0.62) contrast(1.3)' : o.soft ? 'grayscale(1) contrast(1.05) brightness(0.78)' : o.ai ? 'grayscale(1) contrast(1.12) brightness(0.9)' : 'grayscale(1) contrast(1.22) brightness(0.94)';

  if (GRAIN.length && !o.inv) { x.beginPath(); x.rect(X, Y, w, h); x.clip(); x.globalCompositeOperation = 'overlay'; x.globalAlpha *= .22;
    const g = GRAIN[FR % 6]; for (let gy = Y; gy < Y + h; gy += 256) for (let gx = X; gx < X + w; gx += 256) x.drawImage(g, gx, gy); }

}
// fill a panel without stretching; z = push inside the picture (camera never moves), fx/fy = focal point (fraction of the source)
function view(img, X, Y, w, h, o = {}) {

  const z = o.z || 1; sw /= z; sh /= z; const fx = o.fx ?? .5, fy = o.fy ?? .5;
  const sx = clamp(fx * iw - sw / 2, 0, iw - sw), sy = clamp(fy * ih - sh / 2, 0, ih - sh);
  plate(img, sx, sy, sw, sh, X, Y, w, h, o); const k = w / sw;

}
function tag(s, X, Y, o = {}) { // source tag: chip + short mono text, just above its frame
  x.save(); x.globalAlpha *= o.a ?? 1; fill(X, Y - 11, 6, 12, o.chip || C.text); x.restore();
  return txt(s, X + 14, Y, { s: o.s || 16, f: F.mono, c: o.c || C.text, w: 600, ls: 1, a: o.a ?? 1, id: o.id });
}
function chip(s, X, Y, o = {}) { // dark label box so a label stays legible on a bright photo
  const sz = o.s || 22, w = tw(s, { s: sz, w: o.w || 700, f: o.f, ls: o.ls }), al = o.al || 'left', x0 = al === 'right' ? X - w : al === 'center' ? X - w / 2 : X;
  x.save(); x.globalAlpha *= o.a ?? 1; fill(x0 - 10, Y - sz * .95, w + 20, sz * 1.35, 'rgba(11,12,14,0.86)'); x.restore();

}

  for (let i = 1; i < P.length; i++) { ang = Math.atan2(P[i][1] - P[i - 1][1], P[i][0] - P[i - 1][0]);
    if (L[i] <= tot) { x.lineTo(P[i][0], P[i][1]); end = P[i]; } else { const f = (tot - L[i - 1]) / (L[i] - L[i - 1]); end = [lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)]; x.lineTo(end[0], end[1]); break; } }
  x.stroke(); x.restore();
  if (o.head && k > .04) { const hs = o.hs || 16; x.save(); x.globalAlpha *= o.a ?? 1; x.fillStyle = o.c || C.acc; x.translate(end[0], end[1]); x.rotate(ang); x.beginPath(); x.moveTo(4, 0); x.lineTo(-hs, -hs * .55); x.lineTo(-hs, hs * .55); x.closePath(); x.fill(); x.restore(); }

}
function polyFill(P, c) { x.save(); x.fillStyle = c; x.beginPath(); P.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.fill(); x.restore(); }
const closeP = P => P.concat([P[0]]);
// ring callout: thin red circle drawn clockwise (0.5 s ease-out); at 60 % a leader and a label come out
function ring(cx, cy, r, k, label, side = 1, id, up = 1) {
  if (k <= 0) return; x.save(); x.strokeStyle = C.acc; x.lineWidth = 2.5; x.beginPath(); x.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(k)); x.stroke(); x.restore();

    x.save(); x.globalAlpha *= a; hair(lx, ly, ex, ey, C.acc, 1.5); hair(ex, ey, ex + side * 14, ey, C.acc, 1.5); x.restore();
    chip(label, ex + side * 24, ey + 8, { s: 22, al: side > 0 ? 'left' : 'right', a, id }); }
}
function badge(X, Y, t, at, bad) { // ✓ (or ✗) in a red box; no words
  if (t >= at) cue('mallet', at, { n: bad ? 0 : 1 }); const k = seg(t, at, at + .06); if (k <= 0) return;
  x.save(); x.globalAlpha *= k; const s = 1 + .3 * (1 - seg(t, at, at + .18)); x.translate(X, Y); x.scale(s, s);
  x.fillStyle = 'rgba(11,12,14,0.9)'; x.fillRect(-17, -17, 34, 34); x.strokeStyle = C.acc; x.lineWidth = 2; x.strokeRect(-17, -17, 34, 34); x.lineWidth = 3.2; x.lineCap = 'round'; x.beginPath();
  if (bad) { x.moveTo(-8, -8); x.lineTo(8, 8); x.moveTo(8, -8); x.lineTo(-8, 8); } else { x.moveTo(-9, 0); x.lineTo(-2, 8); x.lineTo(10, -8); }

}
function flashRect(X, Y, w, h, k) { if (k <= 0) return; x.save(); x.globalAlpha = k; fill(X, Y, w, h, '#fff'); x.restore(); }
function lower(X, Y, title, sub, k, id) { if (k <= 0) return; x.save(); x.globalAlpha *= k; fill(X, Y, 6, 74, C.acc); x.restore();
  txt(title, X + 24, Y + 36, { s: 36, w: 700, a: k, id }); if (sub) txt(sub, X + 26, Y + 66, { s: 17, f: F.mono, c: C.dim, ls: 2, a: k }); }
function count(t, a, b, v0, v1) { const k = eo(seg(t, a, b)); if (t >= a && t < b) for (let s = a; s < b; s += .1) cue('tick', +s.toFixed(2), { v: .35 }); return Math.round(lerp(v0, v1, k)); }

// ── geography: Natural Earth 1:50m coastline, no borders; the valley map is the user's photographed information panel ──
const VAJ = [12.33, 46.27], VEN = [12.33, 45.44];
function locator(t, M, o) {
  fill(M.X, M.Y, M.w, M.h, C.panel); x.save(); clipR(M);
  const sc = o.sc, cx = M.X + M.w * (o.cx ?? .5), cy = M.Y + M.h * (o.cy ?? .5), c0 = o.c0;
  const base = (lon, lat) => [cx + (lon - c0[0]) * sc * Math.cos(45.5 * Math.PI / 180), cy - (lat - c0[1]) * sc];
  const pin = base(...VAJ), z = o.z || 1, prj = (lon, lat) => { const p = base(lon, lat); return [pin[0] + (p[0] - pin[0]) * z, pin[1] + (p[1] - pin[1]) * z]; };
  for (let g = Math.floor(c0[1]) - 6; g <= c0[1] + 6; g++) { const a = prj(c0[0] - 12, g), b = prj(c0[0] + 12, g); hair(a[0], a[1], b[0], b[1], 'rgba(255,255,255,0.035)'); }
  for (let g = Math.floor(c0[0]) - 9; g <= c0[0] + 9; g++) { const a = prj(g, c0[1] - 8), b = prj(g, c0[1] + 8); hair(a[0], a[1], b[0], b[1], 'rgba(255,255,255,0.035)'); }
  const k = o.k ?? 1; for (const ln of COAST) polyK(ln.map(p => prj(p[0], p[1])), k, { c: C.dim, w: 1.4 });
  if (k > .7) { const a = seg(k, .7, 1); const v = prj(...VEN); x.save(); x.globalAlpha = a; x.fillStyle = C.dim; x.fillRect(v[0] - 3, v[1] - 3, 6, 6); x.restore();
    txt('Venice', v[0] + 10, v[1] + 18, { s: o.small ? 13 : 16, f: F.mono, c: C.dim, a });
    if (!o.small) { const s = prj(13.6, 44.25); txt('ADRIATIC SEA', s[0], s[1], { s: 15, f: F.mono, c: C.faint, ls: 3, a });
      const al = prj(10.2, 46.75); txt('A L P S', al[0], al[1], { s: 18, f: F.mono, c: C.faint, ls: 4, a }); } }

  if (o.label && pk > .6) chip(o.label, pp[0] + (o.small ? 26 : 42), pp[1] + 8, { s: o.small ? 20 : 26, a: seg(pk, .6, .8), id: o.lid });
  if (!o.small) { const km = 50, px = km / 111 * sc * z; hair(M.X + 30, M.Y + M.h - 30, M.X + 30 + px, M.Y + M.h - 30, C.dim, 2); txt(km + ' km', M.X + 40 + px, M.Y + M.h - 24, { s: 14, f: F.mono, c: C.dim }); }

// valley map (source px of map.jpg, 2004×1339): slide area as drawn on the panel ("Frana"), dam (725), towns
const MAP = {
  slide: [[930,616],[1002,587],[1088,573],[1145,558],[1217,601],[1288,630],[1345,658],[1338,773],[1324,859],[1260,902],[1145,895],[1031,873],[945,830],[923,744]],
  dam: [930, 673], longarone: [472, 575], casso: [960, 494], erto: [1640, 360], slideC: [1135, 735],
  west: [[1060,712],[990,688],[930,673],[860,656],[790,642],[700,628],[620,612]],
  north: [[1060,640],[1030,570],[985,505]],
  east: [[1330,700],[1450,650],[1580,575],[1700,480]],
  toLong: [[620,612],[560,596],[490,580]] };

// ═════════ scenes (content y 60–900; subtitles below) ═════════
function s01(t) { // 0.00–3.20 SUMMER 1959 · where
  const P = { X: 60, Y: 92, w: 600, h: 804 };
  view(IM.gorge55, P.X, P.Y, P.w, P.h, { z: lerp(1, 1.04, seg(t, 0, 3.2)), fx: .5, fy: .42, flash: fl(t, 0) });

  if (t >= .9) { cue('click', .9, { v: 1.2 }); txt('1959', 714, 384, { s: 200, w: 700, a: on(t, .9), id: 'r01b' }); flashRect(714, 210, 470, 190, (1 - seg(t, .9, 1.0)) * .8); }
  if (t >= .6) { const M = { X: 1240, Y: 92, w: 620, h: 560 }; cue('paper', .6);

  if (t >= 3.5) { const E = { X: 1400, Y: 92, w: 460, h: 337 }; const me = view(IM.edo, E.X, E.Y, E.w, E.h, { flash: fl(t, 3.5) }); tag('PHOTO · later', E.X, 78, { id: 't02b' });

}
function s03(t) { // 7.90–12.00 the dam, measured
  const P = { X: 60, Y: 92, w: 575, h: 805 };
  const mp = view(IM.dam60v, P.X, P.Y, P.w, P.h, { z: lerp(1, 1.03, seg(t, 7.9, 12)), fx: .5, fy: .5, flash: fl(t, 7.9) }); tag('PHOTO · 1960', P.X, 78, { id: 't03a' });
